name: ci
on: [push, pull_request]
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      # go-version-file reads go.mod; GOTOOLCHAIN=auto (default) lets each
      # module pull the toolchain its own go directive names. Never write a
      # Go version literal here — it drifts from go.mod.
      - uses: actions/setup-go@v6
        with: { go-version-file: go.mod }
      - uses: khanakia/volt-action@v1
        with: { args: ci }
